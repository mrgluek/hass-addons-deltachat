name: Build & Publish Add-ons

on:
  push:
    branches: [main]
    paths:
      - "addons/**/config.yaml"
      - "addons/**/Dockerfile"
      - "addons/**/run.sh"
      - "addons/**/rootfs/**"
      - ".github/workflows/builder.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Add-on to build ('all' or specific addon name)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - uptime
          - telegram_bridge
          - webpreview
          - bouncer
          - ntfy
          - yt
          - username
          - publish
  repository_dispatch:
    types: [build-addon]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - uptime
          - telegram_bridge
          - webpreview
          - bouncer
          - ntfy
          - yt
          - username
          - publish
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if addon should be built
        id: check
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "${{ matrix.addon }}" ]; then
              echo "Selected for build: ${{ matrix.addon }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping: ${{ matrix.addon }} (target is $TARGET)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" = "repository_dispatch" ]; then
            TARGET="${{ github.event.client_payload.addon }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "${{ matrix.addon }}" ]; then
              echo "Selected for build: ${{ matrix.addon }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping: ${{ matrix.addon }} (target is $TARGET)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          elif printf '%s' "$HEAD_MSG" | grep -qF '[images prebuilt]'; then
            # Version bump from "Sync Upstream Bot Versions": it already built and
            # pushed these images before committing, so don't rebuild them.
            echo "Skipping: ${{ matrix.addon }} (images prebuilt by the sync workflow)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            # Push event: check git diff for changes in this addon
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              DIFF=$(git diff --name-only HEAD~1 HEAD)
            else
              DIFF=""
            fi

            if [ -z "$DIFF" ] || echo "$DIFF" | grep -q "^.github/workflows/builder.yml"; then
              echo "Workflow changed or initial commit, building ${{ matrix.addon }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
            elif echo "$DIFF" | grep -E -q "^addons/${{ matrix.addon }}/(config\.yaml|Dockerfile|run\.sh|rootfs/)"; then
              echo "Build files changed in addons/${{ matrix.addon }}/, building..."
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping: ${{ matrix.addon }} (no image-affecting changes in addons/${{ matrix.addon }}/)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build & publish image
        if: steps.check.outputs.build == 'true'
        uses: ./.github/actions/build-addon
        with:
          addon: ${{ matrix.addon }}
