name: Build & Publish Add-ons

on:
  push:
    branches: [main]
    paths:
      - "addons/**"
      - ".github/workflows/builder.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Add-on to build ('all' or specific addon name)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - uptime
          - telegram_bridge
          - webpreview
          - bouncer
          - ntfy
          - yt
          - username
          - publish
  repository_dispatch:
    types: [build-addon]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - uptime
          - telegram_bridge
          - webpreview
          - bouncer
          - ntfy
          - yt
          - username
          - publish
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if addon should be built
        id: check
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "${{ matrix.addon }}" ]; then
              echo "Selected for build: ${{ matrix.addon }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping: ${{ matrix.addon }} (target is $TARGET)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT" = "repository_dispatch" ]; then
            TARGET="${{ github.event.client_payload.addon }}"
            if [ -z "$TARGET" ] || [ "$TARGET" = "all" ] || [ "$TARGET" = "${{ matrix.addon }}" ]; then
              echo "Selected for build: ${{ matrix.addon }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping: ${{ matrix.addon }} (target is $TARGET)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Push event: check git diff for changes in this addon
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              DIFF=$(git diff --name-only HEAD~1 HEAD)
            else
              DIFF=""
            fi

            if [ -z "$DIFF" ] || echo "$DIFF" | grep -q "^.github/workflows/builder.yml"; then
              echo "Workflow changed or initial commit, building ${{ matrix.addon }}"
              echo "build=true" >> "$GITHUB_OUTPUT"
            elif echo "$DIFF" | grep -q "^addons/${{ matrix.addon }}/"; then
              echo "Changes detected in addons/${{ matrix.addon }}/, building..."
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping: ${{ matrix.addon }} (no changes in addons/${{ matrix.addon }}/)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Extract metadata from config.yaml
        if: steps.check.outputs.build == 'true'
        id: meta
        run: |
          VERSION=$(grep '^version:' addons/${{ matrix.addon }}/config.yaml | head -n1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          IMAGE=$(grep '^image:' addons/${{ matrix.addon }}/config.yaml | head -n1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "Building image: $IMAGE version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Publish Multi-Arch Image (amd64, arm64)
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: addons/${{ matrix.addon }}
          file: addons/${{ matrix.addon }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
