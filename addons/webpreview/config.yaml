name: "Delta Chat Web Preview Bot"
description: "Generates rich OpenGraph link previews and full-page archive screenshots for URLs posted in Delta Chat"
version: "2.9.6"
slug: "deltachat_webpreview"
url: "https://github.com/mrgluek/deltachat_webpreview"
arch:
  - aarch64
  - amd64
image: "ghcr.io/mrgluek/addon-deltachat-webpreview"
startup: "services"
boot: "auto"
init: true
webui: "http://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web preview service"
options:
