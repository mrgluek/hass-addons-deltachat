configuration:
  auto_server:
    name: "Автоматически выбрать ближайший сервер"
    description: "Необязательно. Если не задан Chatmail QR и не заданы Email/пароль, ядро само выберет ближайший доступный Chatmail-сервер (и позже добавит ещё реле)."
  chatmail_qr:
    name: "Chatmail QR-код / URI"
    description: "Строка приглашения DCACCOUNT:... или QR-код. Необязательно: оставьте пустым для автоматического выбора ближайшего сервера (или используйте Email/пароль)."
  email:
    name: "Email адрес"
    description: "Email адрес для бота (оставьте пустым при использовании Chatmail QR)."
  password:
    name: "Пароль Email"
    description: "Пароль или пароль приложения для почтового ящика."
  mail_server:
    name: "Сервер IMAP"
    description: "Сервер входящей почты (необязательно, автоопределение если пусто)."
  mail_port:
    name: "Порт IMAP"
    description: "Порт сервера входящей почты (по умолчанию: 993)."
  send_server:
    name: "Сервер SMTP"
    description: "Сервер исходящей почты (необязательно, автоопределение если пусто)."
  send_port:
    name: "Порт SMTP"
    description: "Порт сервера исходящей почты (по умолчанию: 465)."
  telegram_token:
    name: "Токен Telegram бота"
    description: "API токен бота Telegram, полученный у @BotFather."
  admin_email:
    name: "Email администратора в Delta Chat"
    description: "Ваш адрес в Delta Chat для получения прав владельца/администратора."
  admin_fingerprint:
    name: "PGP-отпечаток администратора"
    description: "Криптографический отпечаток OpenPGP ключа администратора (необязательно)."
  display_name:
    name: "Имя бота"
    description: "Отображаемое имя бота в Delta Chat профиле."
  status_text:
    name: "Статус бота"
    description: "Текст статуса (био) в профиле бота."
