  admin_fingerprint:
    name: "Отпечаток ключа администратора"
    description: "Криптографический OpenPGP отпечаток администратора (необязательно)."
  display_name:
    name: "Отображаемое имя"
    description: "Имя бота в профиле Delta Chat."
  status_text:
    name: "Статус профиля"
    description: "Текст статуса (био) в профиле Delta Chat."
