configuration:
  chatmail_qr:
    name: "QR-код / URI Chatmail"
    description: "Строка приглашения DCACCOUNT:... или QR-код (оставьте пустым при использовании Email/пароля)."
  email:
    name: "Email адрес"
    description: "Email адрес для бота (оставьте пустым при использовании Chatmail QR)."
  password:
