name: "Delta Chat ntfy Bot"
description: "Bidirectional push notification bridge between ntfy.sh topics and Delta Chat chats"
version: "1.1.0"
slug: "deltachat_ntfy"
url: "https://github.com/mrgluek/deltachat_ntfy"
arch:
  - aarch64
  - amd64
image: "ghcr.io/mrgluek/addon-deltachat-ntfy"
startup: "services"
boot: "auto"
init: true
webui: "http://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "ntfy webhook receiver & dashboard"
options:
  chatmail_qr: ""
  email: ""
  password: ""
  mail_server: ""
  mail_port: 993
