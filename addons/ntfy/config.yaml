  send_port: 465
  auth_token: ""
  admin_email: ""
  admin_fingerprint: ""
  display_name: "ntfy Bot"
  status_text: "Bridge between ntfy and Delta Chat"
schema:
  chatmail_qr: "str?"
  email: "str?"
  password: "password?"
  mail_server: "str?"
  mail_port: "int?"
