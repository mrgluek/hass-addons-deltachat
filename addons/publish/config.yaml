name: "Delta Chat Publish Bot"
description: "Publishes blog posts and images directly to Astro blogs via Forgejo / Gitea REST API with single-commit multi-file publishing"
version: "1.0.1"
slug: "deltachat_publish"
url: "https://github.com/mrgluek/deltachat_publish"
arch:
  - aarch64
  - amd64
image: "ghcr.io/mrgluek/addon-deltachat-publish"
startup: "services"
boot: "auto"
init: true
options:
  chatmail_qr: ""
  email: ""
  password: ""
  mail_server: ""
  mail_port: 993
  send_server: ""
  send_port: 465
  admin_email: ""
  admin_fingerprint: ""
  forgejo_url: "https://git.gluek.info"
  forgejo_token: ""
  forgejo_repo_owner: "gluek"
  forgejo_repo_name: "gluek.info"
  forgejo_branch: "main"
  blog_post_format: "single_file"
  blog_content_path: "src/content/blog"
  blog_images_path: "public/images"
  blog_image_url_prefix: "/images"
  blog_public_url_prefix: "https://gluek.info/blog"
  display_name: "Publish Bot"
  status_text: "Publishes blog posts directly to Git/Astro via Delta Chat"
