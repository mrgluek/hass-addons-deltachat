configuration:
  auto_server:
    name: "Автоматически выбрать ближайший сервер"
    description: "Необязательно. Если не задан Chatmail QR и не заданы Email/пароль, ядро само выберет ближайший доступный Chatmail-сервер (и позже добавит ещё реле)."
  chatmail_qr:
    name: "QR-код / URI Chatmail"
    description: "Строка приглашения DCACCOUNT:... или QR-код. Необязательно: оставьте пустым для автоматического выбора ближайшего сервера (или используйте Email/пароль)."
  email:
    name: "Email адрес"
    description: "Email адрес для бота (оставьте пустым при использовании Chatmail QR)."
  password:
    name: "Пароль от почты"
    description: "Пароль или пароль приложения для почтового ящика бота."
  mail_server:
    name: "Сервер IMAP"
    description: "Сервер входящей почты (необязательно, определяется автоматически)."
  mail_port:
    name: "Порт IMAP"
    description: "Порт входящей почты (по умолчанию: 993)."
  send_server:
    name: "Сервер SMTP"
    description: "Сервер исходящей почты (необязательно, определяется автоматически)."
  send_port:
    name: "Порт SMTP"
    description: "Порт исходящей почты (по умолчанию: 465)."
  admin_email:
    name: "Email администратора"
    description: "Ваш адрес в Delta Chat для управления настройками бота."
  admin_fingerprint:
    name: "Отпечаток ключа администратора"
    description: "Криптографический OpenPGP отпечаток администратора (необязательно)."
  display_name:
    name: "Отображаемое имя"
    description: "Имя бота в профиле Delta Chat."
  status_text:
    name: "Статус профиля"
    description: "Текст статуса (био) в профиле Delta Chat."
