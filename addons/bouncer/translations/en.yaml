configuration:
  chatmail_qr:
    name: "Chatmail QR / URI"
    description: "DCACCOUNT:... invite URI or QR code string (leave empty if using Email/Password)."
  email:
    name: "Email Address"
    description: "Email address for the bot (leave empty if using Chatmail QR)."
  password:
    name: "Email Password"
    description: "Password or App Password for the email account."
  mail_server:
    name: "IMAP Server"
    description: "Incoming mail server (optional, auto-detected if empty)."
  mail_port:
    name: "IMAP Port"
    description: "Incoming mail server port (default: 993)."
  send_server:
    name: "SMTP Server"
    description: "Outgoing mail server (optional, auto-detected if empty)."
  send_port:
    name: "SMTP Port"
    description: "Outgoing mail server port (default: 465)."
  admin_email:
    name: "Admin Delta Chat Email"
    description: "Your Delta Chat address to manage bot settings."
  admin_fingerprint:
    name: "Admin Fingerprint"
    description: "Cryptographic OpenPGP fingerprint of the administrator (optional)."
  display_name:
    name: "Display Name"
    description: "Display name shown in Delta Chat profile."
  status_text:
    name: "Status Text"
    description: "Status bio text shown in Delta Chat profile."
  virustotal_api_key:
    name: "VirusTotal API Key"
    description: "Free API key from virustotal.com for link and file inspection via /virus (optional)."
  base_url:
    name: "Base Web URL"
    description: "Public base URL for channel preview pages and RSS feeds (e.g. https://dc.yourdomain.com or https://my-ha.duckdns.org:8080)."
  call_echo:
    name: "Echo Calls"
    description: "Answer Delta Chat calls and echo the caller's voice back, then send call statistics (packet loss, jitter, round trip)."
  call_echo_who:
    name: "Who Can Call"
    description: "everybody: any non-blocked contact, including contact requests; contacts: accepted contacts only."
  call_echo_delay:
    name: "Echo Delay (seconds)"
    description: "0 is a live echo; e.g. 1.5 lets callers finish a sentence before hearing it back."
  call_echo_max_seconds:
    name: "Max Call Length (seconds)"
    description: "The bot hangs up after this many seconds."
  call_echo_max_concurrent:
    name: "Max Parallel Calls"
    description: "Further callers get a 'line busy' message."
