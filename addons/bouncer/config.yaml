name: "Delta Chat Bouncer Bot"
description: "Monitors group inactivity, purges stale members, manages group/channel catalogs, tests mail relays and calls (echo service), and provides channel web previews & RSS"
version: "2.24.0"
slug: "deltachat_bouncer"
url: "https://github.com/mrgluek/deltachat_bouncer"
arch:
  - aarch64
  - amd64
image: "ghcr.io/mrgluek/addon-deltachat-bouncer"
startup: "services"
boot: "auto"
init: false
ingress: true
ingress_port: 8080
panel_icon: "mdi:shield-account"
panel_title: "Bouncer Bot"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Channel preview & RSS web service (optional direct external access)"
options:
  chatmail_qr: "dcaccount:https://chat.gluek.info/new"
  email: ""
  password: ""
  mail_server: ""
  mail_port: 993
  send_server: ""
  send_port: 465
  admin_email: ""
  admin_fingerprint: ""
  display_name: "Bouncer Bot"
  status_text: "Monitors group inactivity and manages group catalogs"
  virustotal_api_key: ""
  base_url: ""
  call_echo: true
  call_echo_who: "everybody"
  call_echo_delay: 0
  call_echo_max_seconds: 300
  call_echo_max_concurrent: 2
schema:
  chatmail_qr: "str?"
  email: "str?"
  password: "password?"
  mail_server: "str?"
  mail_port: "int?"
  send_server: "str?"
  send_port: "int?"
  admin_email: "str?"
  admin_fingerprint: "str?"
  display_name: "str?"
  status_text: "str?"
  virustotal_api_key: "password?"
  base_url: "str?"
  call_echo: "bool?"
  call_echo_who: "list(everybody|contacts)?"
  call_echo_delay: "float(0,10)?"
  call_echo_max_seconds: "int(30,3600)?"
  call_echo_max_concurrent: "int(1,10)?"
